plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hozinking.touring3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.hozinking.touring3d"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Filament membawa .so per ABI; jangan strip
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Mesin render 3D Google — ringan untuk mobile
    implementation 'com.google.android.filament:filament-android:1.77.3'
}
